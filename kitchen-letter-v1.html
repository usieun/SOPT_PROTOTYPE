<title>키친레터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 레이아웃: 토스처럼 한 화면에 한 가지 목적. 큰 제목 → 핵심 콘텐츠 → 하단 고정 버튼.
   흑백 UI 위에서 그림만 두들로 표현하고, 색은 조리 장면과 완성 요리에만 쓴다. */
:root{
  --bg:#FFFFFF; --ink:#191919; --muted:#6B6B6B; --faint:#9A9A9A; --line:#F0F0F0; --fill:#F4F4F4; --fill2:#FAFAFA;
  --gut:24px; --r:16px;
  --f:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;word-break:keep-all;overflow-wrap:anywhere}
@media (min-width:520px){body{background:#EDEDED;padding-block:20px;align-items:center}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{position:relative;width:100%;max-width:440px;height:100%;max-height:940px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.app{border-radius:28px;box-shadow:0 20px 50px -30px rgba(0,0,0,.25)}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;display:flex;flex-direction:column}
.scroll > *{flex:none}
.g,.pad{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 두들 */
.doodle,.ing-ic,.kitchen-art{display:block;width:100%;height:auto}
.ln{fill:none;stroke:#1E1E1E;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wc{filter:url(#bleed);opacity:.93}

/* 상단 바 */
.bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;background:rgba(255,255,255,.96);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.bar.root{padding-left:max(var(--gut),env(safe-area-inset-left,0px))}
.bar .bt{flex:1;min-width:0;font-size:16px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:44px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.03em}
.brand small{font-size:12px;font-weight:500;color:var(--faint);margin-left:6px;letter-spacing:0}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:none;border-radius:50%;flex:none}
.icon-btn:hover{background:var(--fill)}

/* 글 */
.page-head{padding-top:8px}
.kicker{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.title,.h-display{margin:6px 0 0;font-size:26px;font-weight:700;line-height:1.38;letter-spacing:-.03em;white-space:pre-line}
.lede,.sub{margin:8px 0 0;font-size:16px;color:var(--muted);line-height:1.6}
.h2,.h-sec{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.small{font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sec{margin-top:40px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{height:40px}
.foot{margin-top:28px;font-size:13px;color:var(--faint);line-height:1.6}
.note{font-size:15px;color:var(--muted);line-height:1.6;margin:0}
.note b{color:var(--ink)}
.grow{flex:1 1 auto !important}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:var(--r);border:0;font-weight:600;font-size:17px;line-height:1.2;text-align:center;background:var(--fill);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--fill);color:#B5B5B5;cursor:not-allowed;transform:none}
.btn-primary,.btn-danger{background:var(--ink);color:#fff}
.btn-primary:hover{filter:brightness(1.25)}
.btn-line,.btn-soft{background:var(--fill);color:var(--ink)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:12px}
.btn-m{min-height:48px;padding:0 18px;font-size:16px;border-radius:14px}
.btn-block{width:100%}
.btn-text,.link{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:10px 0;font-weight:500;font-size:15px;color:var(--muted)}
.btn-text:hover{color:var(--ink)}
.cta{position:sticky;bottom:0;z-index:5;margin-top:auto;padding-top:20px;padding-bottom:16px;background:linear-gradient(rgba(255,255,255,0),#fff 20px)}
.cta p{margin:0 0 10px;font-size:14px;text-align:center;color:var(--muted)}
.cta .row2{display:grid;grid-template-columns:1fr 2fr;gap:8px}

/* 목록 */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 0;border:0;background:none;text-align:left;border-radius:14px}
button.li:hover,label.li:hover{background:var(--fill2)}
.li .lm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .lm b{font-size:17px;font-weight:600;line-height:1.4}
.li .lm span{font-size:14px;color:var(--muted);line-height:1.45}
.li .ls{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--faint);white-space:nowrap}
.li .ls.due{color:var(--ink);font-weight:700}
.thumb-ic{width:52px;height:52px;border-radius:14px;background:var(--fill);display:grid;place-items:center;flex:none;padding:6px}
.thumb-ic .ic{width:24px;height:24px}
.pill-inv{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.empty{padding:48px 8px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:18px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid #D6D6D6;display:grid;place-items:center;flex:none;background:#fff}
.check.on{background:var(--ink);border-color:var(--ink);color:#fff}
.check .ic{width:16px;height:16px;stroke-width:2.6}

/* 선택 */
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * var(--gut));padding-right:var(--gut)}
.pills::-webkit-scrollbar{display:none}
.pills button,.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);font-weight:600;font-size:14px;color:var(--muted)}
.pills button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--fill);border-radius:14px;padding:4px}
.seg > *{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span,.seg button{display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 6px;font-weight:600;font-size:15px;border:0;background:none;width:100%;border-radius:11px;color:var(--faint)}
.seg input:checked + span,.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg input:focus-visible + span{outline:2px solid var(--ink);outline-offset:-2px}

/* 폼 */
.form{display:flex;flex-direction:column;gap:24px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field > label,.field > .lab{font-size:14px;font-weight:600;color:var(--muted)}
.field .opt{font-weight:400;color:var(--faint)}
.input{width:100%;min-height:56px;border:0;border-radius:var(--r);background:var(--fill);padding:0 16px;font-size:17px}
.input::placeholder{color:#AAAAAA}
.input:focus{outline:2px solid var(--ink);outline-offset:0;background:#fff}
.field.invalid .input{outline:2px solid var(--ink)}
.err-msg{font-size:14px;color:var(--ink);font-weight:700}
.err-msg::before{content:"! "}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
details.more{border-top:1px solid var(--line);padding-top:4px}
details.more summary{cursor:pointer;font-size:15px;font-weight:500;color:var(--muted);padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:8px;height:8px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg) translate(-2px,-2px)}
details.more[open] summary::after{transform:rotate(-135deg)}
.chk{display:inline-flex;align-items:center;gap:12px;font-weight:500;font-size:16px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:#191919;margin:0}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:15px;font-weight:600;margin:0}

/* 하단 탭 */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#fff;padding-top:4px;padding-bottom:6px;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;background:none;color:#B0B0B0;font-size:12px;font-weight:500}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .ic{stroke-width:2.2}

/* 시트 · 토스트 */
.sheet-wrap{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.4);animation:fade .18s}
.sheet{background:#fff;border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;padding:10px max(var(--gut),env(safe-area-inset-right,0px)) 24px max(var(--gut),env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:#E2E2E2;margin:0 auto 16px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:22px;font-weight:700;flex:1;min-width:0;letter-spacing:-.03em;line-height:1.35}
.sheet-head .icon-btn{margin:-8px -10px 0 0}
.sheet-ic{width:72px;height:72px;border-radius:20px;background:var(--fill);padding:10px;margin-bottom:14px}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.act2 .btn{flex-direction:column;gap:2px;min-height:72px}
.act2 .btn small{font-size:13px;font-weight:500;color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:60;display:flex;align-items:center;gap:10px;background:#2B2B2B;color:#fff;border-radius:14px;padding:15px 18px;font-size:15px;animation:up .2s}
.toast.low{bottom:auto;top:64px}
.toast span{flex:1}
.toast button{border:0;background:none;color:#fff;font-weight:700;padding:4px;font-size:15px}

/* 홈 */
.kitchen{position:relative;aspect-ratio:360/420;width:100%;max-width:100%;transition:transform .22s ease-in}
.kitchen.zoom{transform:scale(1.12)}
.kitchen-art,.kitchen-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kitchen-img{filter:grayscale(1)}
.hot{position:absolute;border:0;border-radius:12px;background:transparent;padding:10px;display:flex;align-items:flex-end;justify-content:center}
.hot:hover,.hot:focus-visible{background:rgba(25,25,25,.05);outline:none}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px 7px 14px;font-weight:600;font-size:14px;line-height:1.1;white-space:nowrap;box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.tag .n{opacity:.7;font-weight:500;font-variant-numeric:tabular-nums}
.box{background:var(--fill2);border-radius:20px;padding:18px 20px}

/* 레시피 */
.rlist{display:flex;flex-direction:column;gap:6px}
.rc{display:flex;align-items:center;gap:16px;width:100%;padding:10px 0;border:0;background:none;text-align:left;border-radius:16px}
.rc:hover{background:var(--fill2)}
.rc .art{width:96px;flex:none;border-radius:16px;background:var(--fill);overflow:hidden}
.rc-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-n{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.rc-m{font-size:14px;color:var(--muted)}
.rc-s{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-top:4px}
.rc-x{font-size:13px;color:var(--faint)}
.glyph{width:9px;height:9px;flex:none}
.group-title{margin:32px 0 6px;font-size:15px;font-weight:700;color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border:0;border-radius:16px;background:var(--fill);text-align:left;min-width:0}
.modes button b{font-size:15px}
.modes button span{font-size:12px;color:var(--muted);line-height:1.35}
.modes button.on{background:var(--ink);color:#fff}
.modes button.on span{color:#CFCFCF}
.hero-art{border-radius:24px;background:var(--fill);overflow:hidden}
.ing-row{display:flex;align-items:center;gap:14px;width:100%;padding:10px 0;border:0;background:none;text-align:left;border-radius:14px}
button.ing-row:hover{background:var(--fill2)}
.ing-row .thumb-ic{width:48px;height:48px}
.ing-row .nm{flex:1;min-width:0;font-weight:600;font-size:16px}
.ing-row .nm small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:1px}
.ing-row.miss .nm small{color:var(--ink)}
.ing-row .amt{font-size:15px;color:var(--faint);white-space:nowrap;display:flex;align-items:center;gap:2px}
.status{display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:16px;font-weight:600}
.optlist{display:flex;flex-direction:column;gap:8px}
.optc{position:relative;display:block}
.optc input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.optc .ob{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;background:var(--fill)}
.optc .ob::after{content:"";width:22px;height:22px;border-radius:50%;border:2px solid #D2D2D2;box-sizing:border-box;flex:none;background:#fff}
.optc input:checked + .ob{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.optc input:checked + .ob::after{border:7px solid var(--ink)}
.optc input:focus-visible + .ob{outline:2px solid var(--ink);outline-offset:2px}
.optc b{font-size:16px;font-weight:600;display:block}
.optc small{font-size:14px;color:var(--muted)}
.sp-msg{margin:16px 0 0;font-size:15px;line-height:1.65;color:var(--muted);background:var(--fill2);border-radius:14px;padding:14px 16px}
.mini-alts{display:flex;flex-direction:column}
.mini-alt{display:flex;align-items:center;gap:14px;padding:8px 0;border:0;background:none;text-align:left;width:100%}
.mini-alt .art{width:64px;flex:none;border-radius:12px;background:var(--fill);overflow:hidden}
.mini-alt b{display:block;font-size:16px}
.mini-alt span span{font-size:14px;color:var(--muted)}

/* 조리 */
.cook-top{display:flex;align-items:center;gap:8px;padding-top:6px;padding-bottom:4px;position:sticky;top:0;background:#fff;z-index:5}
.cook-top .ct{flex:1;text-align:center;font-size:15px;font-weight:600}
.cook-top .cn{width:44px;text-align:right;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--fill);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stage{position:relative;margin-top:16px;border-radius:24px;background:#FBF9F5;overflow:hidden;aspect-ratio:4/3}
.stage .lay{position:absolute;inset:0}
.stage .lay svg{width:100%;height:100%}
.stage .colr{clip-path:inset(100% 0 0 0);transition:clip-path 1.1s cubic-bezier(.3,.7,.2,1) .15s}
.stage.go .colr{clip-path:inset(0 0 0 0)}
.tpill{display:flex;align-items:center;gap:8px;margin-top:12px;width:100%;padding:12px 16px;border-radius:14px;border:0;background:var(--fill);font-weight:600;font-size:14px;text-align:left}
.step{padding-top:22px}
.step.in-next{animation:inR .22s ease-out}
.step.in-prev{animation:inL .22s ease-out}
@keyframes inR{from{transform:translateX(20px);opacity:0}}
@keyframes inL{from{transform:translateX(-20px);opacity:0}}
.step-k{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
.step-t{margin:6px 0 0;font-size:24px;line-height:1.45;font-weight:700;letter-spacing:-.03em;text-wrap:pretty}
.tip{margin:8px 0 0;font-size:15px;color:var(--muted)}
.infobox{margin-top:20px;background:var(--fill2);border-radius:20px;padding:4px 18px}
.kv{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0}
.kv + .kv{border-top:1px solid var(--line)}
.kv .k{width:56px;font-size:14px;color:var(--muted);flex:none}
.heat-v{display:flex;align-items:center;gap:10px;flex:1;min-width:0;flex-wrap:wrap}
.heat-v b{font-size:17px}
.heat-v .hint{font-size:13px;color:var(--muted);width:100%}
.flames{display:flex;gap:1px}
.flames .ic{width:20px;height:20px;stroke:#CFCFCF;stroke-width:1.5}
.flames .ic.on{fill:var(--ink);stroke:var(--ink)}
.tbox{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.tbox.none{font-size:15px;color:var(--muted)}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t-lab{font-size:13px;font-weight:600;color:var(--muted)}
.tbox.done .t-lab{color:var(--ink)}
.t-num{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.t-bar{display:none}
.t-btns{display:flex;align-items:center;gap:4px}

.t-btns .btn-text{padding:10px 6px}
.ask-a{margin-top:6px;font-size:15px;line-height:1.65;background:var(--fill2);border-radius:14px;padding:14px 16px}
.ask-a .who{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:4px}
.qlist{display:flex;flex-direction:column;gap:6px;margin:14px 0 14px}
.qlist button{border:0;background:var(--fill);border-radius:14px;text-align:left;padding:14px 16px;font-size:15px;font-weight:500;display:flex;justify-content:space-between;gap:8px}

/* 모드 */
.mrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.mrow-main{display:flex;align-items:center;gap:14px;border:0;background:none;text-align:left;padding:0;min-width:0;flex:1}
.mrow-main .art{width:64px;flex:none;border-radius:14px;background:var(--fill);overflow:hidden}
.mrow-main b{display:block;font-size:16px;font-weight:700}
.mrow-main span span{display:block;font-size:14px;color:var(--muted)}
.dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl div{background:var(--fill2);border-radius:16px;padding:14px 16px}
.dl dt{font-size:13px;color:var(--muted)}
.dl dd{margin:2px 0 0;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--fill);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.modeline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:12px 16px;border-radius:14px;background:var(--fill2);font-size:14px;color:var(--muted)}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = n => { const d = today0(); d.setDate(d.getDate()+n); return toISO(d); };
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysUntil = s => Math.round((parseISO(s) - today0()) / 86400000);
const fmtDate = s => { const d = parseISO(s); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
const relDay = s => { const n = daysUntil(s); return n===0?'오늘':n===-1?'어제':n===1?'내일':n===-2?'그저께':fmtDate(s); };
const todayLabel = () => { const d = new Date(); return `${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; };
const won = n => `${Math.round(n).toLocaleString('ko-KR')}원`;
const mmss = s => `${pad2(Math.floor(s/60))}:${pad2(s%60)}`;
const mins = s => s < 60 ? `${s}초` : s % 60 ? `${Math.floor(s/60)}분 ${s%60}초` : `${s/60}분`;
const uid = () => 'i' + Math.random().toString(36).slice(2, 9);
const batchim = w => { const c = String(w).charCodeAt(String(w).length-1); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28 !== 0; };
const eul = w => w + (batchim(w) ? '을' : '를');
const eun = w => w + (batchim(w) ? '은' : '는');
const nm = k => CATALOG[k] ? (CATALOG[k].short || CATALOG[k].name) : k;
const fullName = k => CATALOG[k] ? CATALOG[k].name : k;
const price = k => CATALOG[k]?.price || 0;
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function keyFor(name){
  const n = String(name||'').replace(/\s+/g,'').trim();
  if(!n) return null;
  for(const [k,c] of Object.entries(CATALOG)){
    const names = [c.name, c.short, ...(c.alias||[])].filter(Boolean).map(x=>x.replace(/\s+/g,''));
    if(names.includes(n)) return k;
  }
  for(const [k,c] of Object.entries(CATALOG)){
    if(n.includes(c.name.replace(/\s+/g,''))) return k;
  }
  return null;
}

function expInfo(it){
  if(!it.expires) return null;
  const n = daysUntil(it.expires);
  if(n < 0) return {cls:'b-over', badge:'권장일 지남', text:`${fmtDate(it.expires)}까지 권장`, n};
  if(n === 0) return {cls:'b-soon', badge:'기한 임박', text:'오늘까지 권장', n};
  if(n === 1) return {cls:'b-soon', badge:'기한 임박', text:'내일까지 권장', n};
  if(n === 2) return {cls:'b-soon', badge:'기한 임박', text:'모레까지 권장', n};
  return {cls:'', badge:null, text:`${fmtDate(it.expires)}까지 권장 · ${n}일 남음`, n};
}
const isSoon = it => it.expires && daysUntil(it.expires) <= 2;
const byExp = (a,b) => (a.expires? daysUntil(a.expires):9999) - (b.expires? daysUntil(b.expires):9999) || a.name.localeCompare(b.name,'ko');

function addItem(o){

    id: uid(), key: o.key !== undefined ? o.key : keyFor(o.name), name: String(o.name).trim(),
    qty: (o.qty||'').trim(), loc: o.loc || 'fridge', type: o.type || 'ingredient',
    bought: o.bought || null, expires: o.expires || null,
    dateLabel: o.dateLabel || (o.type==='cooked' ? '보관 시작' : '구매'),
    note: o.note || '', origin: o.origin || '', source: o.source || 'manual', status:'active', statusAt:null, seen:false, icon:null,
  };
  S.items.push(it);
  return it;
}

/* ---------------- 레시피 분석 ---------------- */
function optsFor(ing, ex){
  const o = [];
  (ing.subs||[]).forEach(s => { if(s.need.every(n => has(n) && !isEx(n))) o.push({...s, kind:'sub'}); });
  if(ing.omit) o.push({id:'omit', kind:'omit', label:ing.omit.label, msg:ing.omit.msg});
  if(!ex) o.push({id:'buy', kind:'buy', label:`${nm(ing.k)} 사서 만들기`, msg:`${eul(fullName(ing.k))} 준비하면 원래 레시피대로 만들 수 있어요. 예상 ${won(price(ing.k))} (데모 추정치)`});
  return o;
}
function analyze(r){
  const rows = r.ings.map(ing => {
    const k = ing.k, ex = isEx(k);
    if(has(k) && !ex) return {ing, have:true, item:firstItem(k)};
    const opts = optsFor(ing, ex);
    const saved = S.choices[r.id]?.[k];
    const choice = (saved && opts.some(o=>o.id===saved)) ? saved : (opts[0]?.id || null);
    const hasSub = opts.some(o=>o.kind==='sub'), canOmit = opts.some(o=>o.kind==='omit');
    const label = hasSub ? '대체 가능' : canOmit ? '생략 가능' : '추가 구매 필요';
    return {ing, have:false, ex, opts, choice, label, hard: !hasSub && !canOmit};
  });
  const missing = rows.filter(x => !x.have);
  const needBuy = missing.filter(x => x.choice === 'buy');
  return {
    rows, missing, needBuy,
    cost: needBuy.reduce((s,x)=>s+price(x.ing.k), 0),
    readiness: !missing.length ? 'ready' : needBuy.length ? 'buy' : 'adapt',
    hidden: missing.some(x => x.opts.length === 0),
  };
}
function stepsFor(r){
  const a = analyze(r), ch = {};
  a.rows.forEach(x => ch[x.ing.k] = x.have ? 'have' : x.choice);
  return r.steps.map(s => {
    if(!s.for) return s;
    let t = s.v[ch[s.for]];
    if(t === undefined) t = s.v.have;
    return t === null ? null : {...s, text:t};
  }).filter(Boolean);
}
function reasonFor(r, a){
  const soon = a.rows.find(x => x.have && x.item && isSoon(x.item));
  if(soon) return `${eul(itemShort(soon.item))} 먼저 써요`;
  const opened = a.rows.find(x => x.have && x.item && x.item.dateLabel==='개봉');
  if(opened) return `개봉한 ${eul(itemShort(opened.item))} 먼저 써요`;
  if(a.readiness === 'ready') return '지금 있는 재료로 바로 만들어요';
  const om = a.missing.find(x => x.choice==='omit');
  if(om && a.readiness==='adapt') return `${nm(om.ing.k)} 없이 만들 수 있어요`;
  const sb = a.missing.find(x => x.opts.find(o=>o.id===x.choice)?.kind==='sub');
  if(sb && a.readiness==='adapt') return `${nm(sb.ing.k)} 대신 ${eul(sb.opts.find(o=>o.id===sb.choice).short)} 써요`;
  if(a.readiness==='buy') return `${a.needBuy.map(x=>nm(x.ing.k)).join(', ')}만 있으면 만들 수 있어요`;
  return '';
}
function score(r, a){
  let s = a.readiness==='ready' ? 0 : a.readiness==='adapt' ? 1 : 3;
  if(a.rows.some(x => x.have && x.item && isSoon(x.item))) s -= 2;
  if(a.rows.some(x => x.have && x.item && x.item.dateLabel==='개봉')) s -= .5;
  if(S.prefs.spice==='mild' && r.spicy) s += 1.5;
  if(S.prefs.spice==='hot' && r.spicy) s -= .8;
  if(S.prefs.styles.includes(STYLE_OF[r.id])) s -= 1;
  return s + r.time/100;
}
const STYLE_OF = {ochazuke:'bowl', spinachegg:'bowl', kfr:'bowl', pasta:'bowl', stew:'soup', manduguk:'soup', tofumush:'side', kimchitofu:'side', mandu:'side'};
function visibleRecipes(){
  return RECIPES.map(r => ({r, a:analyze(r)})).filter(x => !x.a.hidden);
}
const hiddenCount = () => RECIPES.filter(r => analyze(r).hidden).length;
function usedItemsFor(r){
  const a = analyze(r), keys = new Set();
  a.rows.forEach(x => {
    if(x.have) keys.add(x.ing.k);
    else { const o = x.opts.find(o=>o.id===x.choice); if(o && o.need) o.need.forEach(n=>keys.add(n)); }
  });
  return active().filter(i => i.key && keys.has(i.key));
}

function sceneObjs(sp, heat){
  const c = sp.c || [];
  const cont = (x,y,s=1) => c.flatMap(k => { const [n,arg] = k.split(':'); return put(P[n](arg), x, y, s); });
  let o = [];
  switch(sp.s){
    case 'board': o = [...V2.board(116,118), ...cont(106,112)]; break;
    case 'pan':   o = [...V2.burner(110, heat), ...V2.pan(110,96), ...cont(110,96,.95)]; break;
    case 'pot':   o = [...V2.burner(120, heat), ...V2.pot(120,70), ...cont(120,72,.95)]; break;
    case 'ttuk':  o = [...V2.ttuk(120,76), ...cont(120,78,.95)]; break;
    case 'micro': o = [...V2.micro(34,36), ...cont(102,114,.62)]; break;
    case 'bowl':  o = [...V2.bowl(120,88), ...cont(120,90)]; break;
    case 'plate': o = [...V2.plate(120,120), ...cont(120,112)]; break;
    case 'cup':   o = V2.cup(); break;
  }
  (sp.x||[]).forEach(k => { const [n,...a] = k.split(':'); o = o.concat(V2[n](...a.map(v=>isNaN(+v)?v:+v))); });
  if(sp.steam) o = o.concat(V2.steam(sp.s==='pot'||sp.s==='ttuk'?120:sp.s==='pan'?110:120, sp.s==='pot'?36:sp.s==='pan'?50:40));
  return o;
}
function sceneSVG(sp, heat, color){
  return `<svg viewBox="0 0 240 180" class="doodle" aria-hidden="true"><g filter="url(#wob)">${drawObjs(sceneObjs(sp, heat), color)}</g></svg>`;
}

function iconKeyFor(it){
  if(!it) return 'generic';
  if(it.icon) return it.icon;
  if(it.type==='cooked') return 'cooked';
  if(it.key && ICON_OBJ[it.key]) return it.key;
  const n = String(it.name||'');
  for(const [re, k] of ICON_RULES) if(re.test(n)) return k;
  return 'generic';
}
function iconFor(it){
  const f = ICON_OBJ[iconKeyFor(it)] || ICON_OBJ.generic;
  return `<svg viewBox="-34 -32 68 60" class="ing-ic" aria-hidden="true"><g filter="url(#wob)">${drawObjs(f(), false)}</g></svg>`;
}

function pricesOf(it){
  const p = it.key && SHOP_PRICE[it.key];
  const mart = it.mart ?? (p ? p[3] : null);
  return { unit: p ? p[0] : '', coupang: p ? p[1] : null, naver: p ? p[2] : null, mart, martInput: it.mart != null };

  return opts.reduce((a,b) => b[1] < a[1] ? b : a)[0];
}

  const t = {coupang:0, naver:0, mart:0}; let n = 0, skip = 0;

const DAY = 86400000;
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; }
const eatDates = id => S.eats.filter(e => e.id===id).map(e => parseISO(e.date));
function weekly(id, n=4){
  const ws = weekStart(today0()), ds = eatDates(id);
  return Array.from({length:n}, (_,i) => { const s = new Date(ws.getTime() - (n-1-i)*7*DAY), e = new Date(s.getTime() + 7*DAY); return ds.filter(d => d >= s && d < e).length; });
}
const thisWeek = id => weekly(id, 1)[0];
function weeklyAvg(id){
  const ds = eatDates(id); if(!ds.length) return null;
  const first = Math.min(...ds.map(d=>d.getTime()));
  if((today0().getTime() - first) / DAY < 21) return null;
  const since = today0().getTime() - 27*DAY;
  const v = Math.round(ds.filter(d => d.getTime() >= since).length / 4 * 10) / 10;
  return String(v).replace(/\.0$/,'');
}

function withHave(keys, fn){
  const tmp = keys.filter(k => !has(k)).map(k => ({id:'tmp_'+k, key:k, name:k, status:'active', loc:'fridge'}));
  S.items.push(...tmp);
  try{ return fn(); } finally { S.items.splice(S.items.length - tmp.length, tmp.length); }
}
/* 이 재료를 사면 새로 만들 수 있는 메뉴(unlock)와 대체 없이 원래대로 만들 수 있는 메뉴(better) */
function unlockBy(keys){
  keys = keys.filter(Boolean);
  if(!keys.length) return {unlock:[], better:[]};
  const before = Object.fromEntries(RECIPES.map(r => [r.id, analyze(r)]));
  const after = withHave(keys, () => Object.fromEntries(RECIPES.map(r => [r.id, analyze(r)])));
  const uses = r => r.ings.some(i => keys.includes(i.k));
  const ok = a => !a.hidden && a.readiness !== 'buy';
  const unlock = RECIPES.filter(r => uses(r) && !ok(before[r.id]) && ok(after[r.id]) && !after[r.id].hidden);
  const better = RECIPES.filter(r => uses(r) && ok(before[r.id]) && before[r.id].missing.some(x => keys.includes(x.ing.k)));
  return {unlock, better};
}
function suggestKeys(){
  const inList = new Set(S.shop.map(s => s.key));
  const cand = [...new Set(RECIPES.flatMap(r => r.ings.map(i => i.k)))].filter(k => !has(k) && !inList.has(k) && !isEx(k));
  return cand.map(k => { const u = unlockBy([k]); return {k, s: u.unlock.length*2 + u.better.length, u}; }).filter(x => x.s > 0).sort((a,b) => b.s - a.s).slice(0,4);
}
function budgetInfo(b=S.budget){
  const days = Number(b.days) || 0, amount = Number(b.amount) || 0, spent = b.spent || 0;
  const elapsed = b.start ? Math.max(0, -daysUntil(b.start)) : 0;
  const remain = days ? Math.max(0, days - elapsed) : null;
  const left = amount ? amount - spent : null;
  return {days, amount, spent, remain, left, perDay: (left!==null && remain) ? Math.floor(Math.max(0,left)/remain) : null};
}

const DIET_OPTS = [['light','가볍게 먹기','약 450kcal 이하'],['protein','단백질 챙기기','단백질 약 16g 이상'],['veg','채소 더하기','채소가 들어간 메뉴'],['kcal','칼로리 낮은 순','칼로리 낮은 순서로']];
function modeChipLabel(k){
  if(k==='low') return S.low.chips.map(c => LOW_CHIPS.find(l=>l[0]===c)[1]).join('·');
  const g = DIET_OPTS.find(o => o[0]===S.diet.goal); return `다이어트${g?` · ${g[1]}`:''}`;
}
/* 레시피 탭의 모드(간단하게 먹기·다이어트)는 목록의 필터·정렬로 작동해요 */
function modeFilter(list){
  let out = list;
  if(S.modes.low && S.low.chips.length){
    out = out.filter(x => S.low.chips.every(c => LOW_CHIPS.find(l=>l[0]===c)[2](x.r)));
  }
  if(S.modes.diet){
    const g = S.diet.goal;
    if(g==='light') out = out.filter(x => x.r.kcal<=450);
    if(g==='protein') out = out.filter(x => x.r.protein>=16);
    if(g==='veg') out = out.filter(x => x.r.veg);
  }
  return out;
}
function modeSort(x, y){
  if(S.modes.diet){ const g = S.diet.goal; if(g==='protein') return y.r.protein - x.r.protein; return x.r.kcal - y.r.kcal; }
  if(S.modes.low) return (x.r.time + x.r.wash.length*3) - (y.r.time + y.r.wash.length*3);
  return 0;
}
function modeInfo(r){
  const out = [];
  if(S.modes.low && r.low.length) out.push(r.low[0]);
  if(S.modes.diet) out.push(`약 ${r.kcal}kcal`);
  return out.join(' · ');
}
function statusLine(r, a){
  if(a.readiness==='ready') return ['ready','바로 만들 수 있어요'];
  if(a.readiness==='buy') return ['buy',`${a.needBuy.map(x=>nm(x.ing.k)).join(', ')}만 있으면 돼요`];
  const x = a.missing[0], o = x.opts.find(o=>o.id===x.choice);
  return ['adapt', `${nm(x.ing.k)}${a.missing.length>1?` 외 ${a.missing.length-1}개`:''} ${o && o.kind==='omit'?'빼고':'대신'} 만들 수 있어요`];
}
function rcard({r,a}){
  const [g, s] = statusLine(r,a);
  const w = thisWeek(r.id);
  const extra = [recipeModesOn().length ? modeInfo(r) : '', w ? `이번 주 ${w}번 먹었어요` : ''].filter(Boolean).join(' · ');
  return `<button class="rc" data-act="recipe" data-id="${r.id}"><span class="art">${dishArt(r)}</span>
    <span class="rc-b"><span class="rc-n">${r.name}</span><span class="rc-m">${r.time}분 · ${r.level} · 1인분</span><span class="rc-s">${GLYPH[g]}${s}</span>${extra?`<span class="rc-x">${extra}</span>`:''}</span></button>`;
}

function ingFilterKeys(){
  const used = new Set(RECIPES.flatMap(r => r.ings.map(i => i.k)));
  const seen = new Set();
  return active().filter(i => i.key && used.has(i.key)).sort(byExp).filter(i => !seen.has(i.key) && seen.add(i.key));
}
function recipeItems(){
  let list = visibleRecipes();
  const q = ui.q.trim();
  if(q) list = list.filter(x => x.r.name.includes(q) || x.r.ings.some(i=>fullName(i.k).includes(q)));
  if(ui.cat!=='all') list = list.filter(x => x.r.cat===ui.cat);
  const sel = ui.ings;

const CHAT_QS = ['오늘 뭐 만들 수 있어요?', '굴소스 대신 뭘 넣어요?', '중불은 어느 정도예요?', '남은 음식은 어떻게 보관해요?', '설거지 적은 메뉴 있어요?'];
function botAnswer(q){
  const n = q.replace(/\s+/g,'');
  const rec = RECIPES.find(r => n.includes(r.name.replace(/\s+/g,'')));
  const ing = Object.entries(CATALOG).find(([k,c]) => [c.name, c.short, ...(c.alias||[])].filter(Boolean).some(x => x.length > 1 && n.includes(x.replace(/\s+/g,''))));
  if(/유통기한|상했|상한|먹어도돼|괜찮을까|냄새/.test(n))
    return {text:'식품 상태는 앱이 판단할 수 없어요. 포장의 표시 기한, 냄새, 색을 확인하고 조금이라도 의심되면 먹지 않는 게 좋아요.'};
  if(/대신|대체|없으면|없어요|없는데/.test(n) && ing){
    const k = ing[0];
    for(const r of RECIPES){ const g = r.ings.find(i => i.k===k); if(!g) continue;
      const sub = (g.subs||[]).find(x => x.need.every(has)); if(sub) return {text:sub.msg, recipes:[r.id]};
      if(g.omit) return {text:g.omit.msg, recipes:[r.id]}; }
    return {text:`${eun(ing[1].name)} 지금 레시피에서 대신할 재료를 찾지 못했어요. 장보기 목록에 넣어 두면 다음 장보기 때 챙길 수 있어요.`};
  }
  if(/약불|중불|강불|불세기|불은/.test(n)){
    const h = n.includes('약불') ? 'low' : n.includes('강불') ? 'high' : 'mid';
    return {text:HEAT_Q[h][1]};
  }
  if(/보관|남은|남았|남겼/.test(n))
    return {text:'홈의 재료 추가에서 ‘만든 음식 넣기’로 기록해 두면, 먹을 날짜가 가까워질 때 냉장고 메모장에 ! 로 알려줘요. 보관 기간은 음식마다 달라서 먹기 전에 상태를 꼭 확인해 주세요.'};
  if(/설거지|간단|귀찮|피곤|빨리/.test(n)){
    const list = visibleRecipes().filter(x => x.a.readiness!=='buy').sort((a,b) => (a.r.time + a.r.wash.length*3) - (b.r.time + b.r.wash.length*3)).slice(0,3);
    return {text:'지금 있는 재료로 손이 덜 가는 메뉴예요.', recipes:list.map(x=>x.r.id)};
  }
  if(rec){ const a = analyze(rec); return {text:`${rec.name}은(는) ${rec.time}분 걸리고, ${statusLine(rec,a)[1]}.`, recipes:[rec.id]}; }
  if(/뭐|메뉴|추천|만들|먹을/.test(n)){
    const list = visibleRecipes().sort((x,y)=>score(x.r,x.a)-score(y.r,y.a)).slice(0,3);
    return {text:'냉장고에 있는 재료로 만들기 좋은 메뉴예요.', recipes:list.map(x=>x.r.id)};
  }
  return {text:'데모라서 정해진 질문에만 답할 수 있어요. 아래 질문을 눌러 보세요.', chips:true};
}
function chatSend(text){
  text = String(text||'').trim(); if(!text || ui.chatTyping) return;
  ui.chat.push({from:'me', text}); ui.chatTyping = true; render({bottom:true});
  setTimeout(() => { ui.chatTyping = false; ui.chat.push({from:'bot', ...botAnswer(text)}); if(cur().name==='chat') render({bottom:true}); }, reduceMotion() ? 0 : 500);
}

const cur = () => stack[stack.length-1];
function render(opt={}){

  const keep = opt.keep ? sc.scrollTop : 0;
  const inner = opt.keep ? ($('#paper-scroll')?.scrollTop || 0) : 0;
  sc.classList.toggle('fixed', r.name==='shop');
  sc.innerHTML = (V[r.name] || V.home)(r.p || {});
  sc.scrollTop = keep;
  const ps = $('#paper-scroll'); if(ps) ps.scrollTop = inner;
  if(r.name==='chat' && opt.bottom) sc.scrollTop = sc.scrollHeight;
  $('#tabbar').hidden = FULL.has(r.name);
  $('#tabbar').innerHTML = tabbar();
  if(r.name==='cook' || r.name==='done') animateFill(r, opt);
  if(r.name==='home') fitKitchen();
}
function fitKitchen(){
  const w = $('#kwrap'), k = $('#kitchen'); if(!w || !k) return;
  const cs = getComputedStyle(w), aw = w.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), ah = w.clientHeight - parseFloat(cs.paddingBottom);
  /* 주방은 가능한 한 원래 크기로, 윗벽 그림은 남는 높이 안에서만 줄여서 보여줘요 (잘리지 않음) */
  const kw = Math.max(200, Math.min(aw, ah * 360/420));
  k.style.width = kw + 'px';
  const top = k.querySelector('.kitchen-top'); if(!top) return;
  const room = ah - kw * 420/360, natural = kw * 190/360;
  top.style.display = room < 70 ? 'none' : '';
  top.style.height = Math.min(natural, room) + 'px';
}
window.addEventListener('resize', () => { if(cur().name==='home') fitKitchen(); });
function leaving(next){
  const r = cur();
  if(r.name==='cook' && next!=='cook'){ timer = null; clearInterval(tickId); }
  if(r.name==='zone'){ let ch = false; active().forEach(i => { if(i.loc===r.p.loc && i.seen===false){ i.seen = true; ch = true; } }); if(ch) save(); }

function replace(name, p={}, opt){ leaving(name); stack[stack.length-1] = {name, p}; render(opt); }

function setTab(t){ leaving(t); closeSheet(); stack = [{name:t, p:{}}]; render(); }

let swipe = null, swipeBlock = 0;
document.addEventListener('pointerdown', e => {
  const fg = e.target.closest('.sw-fg'); if(!fg || e.button>0) return;
  swipe = {fg, row: fg.parentElement, x:e.clientX, y:e.clientY, dx:0, on:false, id:e.pointerId};
});
document.addEventListener('pointermove', e => {
  if(!swipe || e.pointerId!==swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if(!swipe.on){ if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)*1.3){ swipe.on = true; swipe.fg.classList.add('drag'); try{ swipe.fg.setPointerCapture(e.pointerId); }catch(_){} } else if(Math.abs(dy) > 12){ swipe = null; return; } else return; }
  const d2 = swipe.row.dataset.kind==='shop' ? Math.min(0, dx) : dx;
  swipe.dx = d2;
  swipe.fg.style.transform = `translateX(${d2}px)`;
  swipe.row.classList.toggle('r', d2 > 0); swipe.row.classList.toggle('l', d2 < 0);
  swipe.row.classList.toggle('arm', Math.abs(d2) > 90);
});
function endSwipe(){
  if(!swipe) return;
  const {fg, row, dx, on} = swipe; swipe = null;
  if(!on) return;
  swipeBlock = Date.now();
  fg.classList.remove('drag');
  if(Math.abs(dx) > 90){
    fg.style.transform = `translateX(${dx>0?'110%':'-110%'})`;
    setTimeout(() => row.dataset.kind==='shop' ? shopRemove(row.dataset.id) : setStatus(row.dataset.id, dx>0 ? 'used' : 'discarded'), reduceMotion()?0:180);
  } else { fg.style.transform = ''; setTimeout(()=>row.classList.remove('r','l','arm'), 200); }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

  tPause: () => { if(!timer) return; timer.remain = Math.max(0, Math.ceil((timer.endAt-Date.now())/1000)); timer.state='pause'; refreshTimer(true); },
  tResume: () => { if(!timer) return; timer.endAt = Date.now()+timer.remain*1000; timer.state='run'; refreshTimer(true); },
  tStop: () => { timer = null; refreshTimer(true); },
  ask: askSheet,
  chatQ: d => chatSend(d.q),
  askQ: d => { const q = askSheet.qs[+d.k]; $('#ask-out').innerHTML = `<div class="ask-a"><div class="who">데모 응답</div><b>${q[0]}</b><br>${q[1]}</div>`; },
  /* 장보기 */
  shopAddKey: d => {
    const fromSheet = !!subSheet.cur;
    if(shopAdd(d.k) === false) return;
    if(fromSheet){ closeSheet(); render({keep:true}); toast(`${eul(nm(d.k))} 장보기 목록에 넣었어요`, {label:'보기', fn:()=>setTab('shop')}); return; }
    render({keep:true});
  },
  shopAddName: () => { if(shopAdd(null, ui.shopQ) !== false) render({keep:true}); },
  shopToggle: d => { const s = S.shop.find(x=>x.id===d.id); if(!s) return; s.got = !s.got; ui.justGot = s.got ? s.id : null; save(); render({keep:true}); },
  shopItem: d => shopItemSheet(d.id),
  shopFinish: () => {
    const got = S.shop.filter(s=>s.got); if(!got.length) return;
    draft = {kind:'shop', store:'장보기', date:addDays(0), err:false, shopIds: got.map(s=>s.id),
      rows: got.map(s => { const c = s.key && CATALOG[s.key], ch = chosenCh(s), p = pricesOf(s); return {raw:'', key:s.key, name: c ? c.name : s.name, suggest:'', low:false, nonfood:false, inc:true, loc: c ? c.loc : 'fridge', exp:'', chLabel: ch ? `${CH.find(x=>x[0]===ch)[2]} ${comma(p[ch])}원` : ''}; })};
    go('review');
  },
  /* 모드 — 설정 화면에서 고른 값은 저장하기를 눌러야 반영돼요 */
  bDays: d => { modeDraft.budget.days = +d.d; render({keep:true}); },
  lowChip: d => { const c = modeDraft.low.chips; modeDraft.low.chips = c.includes(d.k) ? c.filter(x=>x!==d.k) : [...c, d.k]; render({keep:true}); },
  dietGoal: d => { modeDraft.diet.goal = modeDraft.diet.goal===d.k ? null : d.k; render({keep:true}); },
  modeSave: d => {
    const k = d.k, was = S.modes[k];
    if(k==='budget'){
      const nb = {...modeDraft.budget}, ob = S.budget;
      if(!was || Number(ob.days)!==Number(nb.days) || !ob.start){ nb.start = addDays(0); nb.spent = 0; }
      S.budget = nb;
    }
    if(k==='low') S.low = {chips:[...modeDraft.low.chips]};
    if(k==='diet') S.diet = {...modeDraft.diet};
    S.modes[k] = true; save(); modeDraft = null;
    if(k==='budget'){ setTab('shop'); toast(was ? '식비 아끼기 설정을 저장했어요' : '식비 아끼기를 켰어요'); return; }
    const n = modeFilter(visibleRecipes()).length;
    setTab('recipes'); toast(`${modeName(k)} ${was?'설정을 저장했어요':'모드를 켰어요'} · 메뉴 ${n}개`);
  },
  modeOff: d => { S.modes[d.k] = false; save(); modeDraft = null; if(MODE_ROUTES.includes(cur().name)) back(); else render({keep:true}); toast(`${modeName(d.k)}${d.k==='diet'?' 모드':''}를 껐어요`); },
  /* 알레르기·비선호 */
  exToggle: d => { const p = PRESET_MAP[d.id]; const i = exDraft.findIndex(t=>t.id===d.id); if(i>=0) exDraft.splice(i,1); else exDraft.push({...p}); render({keep:true}); },
  exRemove: d => { exDraft = exDraft.filter(t=>t.id!==d.id); render({keep:true}); },
  exAdd: () => {
    const el = $('#ex-in'), v = (el?.value||'').trim(); if(!v) return;
    if(exDraft.some(t=>t.label===v)){ toast('이미 추가한 재료예요'); return; }
    const n = v.replace(/\s+/g,'');
    const keys = Object.entries(CATALOG).filter(([k,c]) => [c.name,c.short,...(c.alias||[])].filter(Boolean).some(x => x.replace(/\s+/g,'').includes(n) || n.includes(x.replace(/\s+/g,'')))).map(([k])=>k);
    exDraft.push({id:'c_'+n, label:v, keys}); render({keep:true});
    toast(keys.length ? `${v} 추가 · ${keys.map(fullName).join(', ')}이(가) 든 메뉴를 빼요` : `${v} 추가 · 지금 레시피에는 이 재료가 없어요`);
    setTimeout(()=>{ const i=$('#ex-in'); if(i) i.focus(); }, 0);
  },
  exSave: () => { S.excluded = exDraft.map(t=>({...t})); save(); exDraft = null; back(); toast(`저장했어요 · 추천에서 ${hiddenCount()}개 메뉴를 빼요`); },
  resetAsk: () => openSheet(`<div class="sheet-head"><h2 style="white-space:pre-line">처음 상태로\n되돌릴까요?</h2><button class="icon-btn" data-act="sheetClose" aria-label="닫기">${ic('close')}</button></div>
    <p class="note" style="margin:0 0 16px">재료, 장보기 목록, 먹은 기록, 제외 재료와 모드 설정이 처음 상태로 돌아가요.</p>
    <div class="act2" style="grid-template-columns:1fr 2fr"><button class="btn" data-act="sheetClose">취소</button><button class="btn btn-primary" data-act="resetDo">되돌리기</button></div>`),
  resetDo: () => { S = freshState(); save(); draft = null; timer = null; Object.assign(ui,{cat:'all',q:'',hist:'used',sq:'',ings:[],serv:{},shopQ:'',justGot:null}); closeSheet(); setTab('home'); toast('처음 상태로 되돌렸어요'); },
};

const CHG = {
  choice: el => { const {r,k} = el.dataset; S.choices[r] = {...(S.choices[r]||{}), [k]:el.value}; save(); render({keep:true}); if(subSheet.cur) subSheet(r,k); },
};
const INP = {
  rq: el => { ui.q = el.value; $('#rlist').innerHTML = recipeList(); },
  sq: el => { ui.sq = el.value; $('#sresults').innerHTML = searchResults(); },
  shopQ: el => { ui.shopQ = el.value; $('#shop-sugg').innerHTML = shopSuggest(); const sc = document.querySelector('.sugg-chips'); if(sc) sc.hidden = !!el.value; },
  /* 금액은 숫자만 — 다른 글자는 바로 지워요 */
  won: el => { modeDraft.budget[el.dataset.f] = wonField(el); $('#b-stats').innerHTML = budgetStats(modeDraft.budget); },
  days: el => { const d = digitsOnly(el.value, 3); el.value = d; modeDraft.budget.days = d ? +d : ''; document.querySelectorAll('[data-act="bDays"]').forEach(c=>c.setAttribute('aria-pressed', String(+c.dataset.d===+d))); const l = $('#b-amt-l'); if(l) l.textContent = +d===1 ? '오늘 쓸 식비' : '이 기간 식비'; $('#b-stats').innerHTML = budgetStats(modeDraft.budget); },
  wonOnly: el => { wonField(el, 7); const r = el.closest('.pick-row')?.querySelector('input[type=radio]'); if(r) r.checked = true; },
};
const SUB = {
  itemSave: f => {
    const it = S.items.find(i=>i.id===f.dataset.id), fd = new FormData(f);
    const name = String(fd.get('name')||'').trim();
    if(!name){ markInvalid('if-name-f','이름을 입력해 주세요.'); return; }
    const type = fd.get('type'), icn = fd.get('icon');
    Object.assign(it, { name, key: type==='cooked' ? null : (keyFor(name) ?? it.key), loc:fd.get('loc'), type, bought:fd.get('bought')||null, expires:fd.get('expires')||null, icon: icn && icn!=='auto' ? icn : null });
    if(it.type==='cooked' && it.dateLabel==='구매') it.dateLabel = '보관 시작';
    save(); closeSheet(); render({keep:true}); toast('저장했어요');
  },
  addSave: f => {
    const fd = new FormData(f), name = String(fd.get('name')||'').trim();
    if(!name){ markInvalid('af-name-f','이름을 입력해 주세요.'); return; }
    const key = f.dataset.key || keyFor(name);
    const it = addItem({key, name, loc:fd.get('loc'), bought:addDays(0), expires:fd.get('expires')||null, source:'manual'});
    save(); closeSheet(); ui.sq=''; render();
    toast(`${eul(esc(it.name))} ${LOC[it.loc].zone}에 넣었어요`, {label:'보기', fn:()=>go('zone',{loc:it.loc})});
  },
  cookedSave: f => {
    const fd = new FormData(f), name = String(fd.get('name')||'').trim();
    if(!name){ markInvalid('cf-name-f','음식 이름을 입력해 주세요.'); return; }
    const it = addItem({key:null, name, loc:fd.get('loc'), type:'cooked', bought:fd.get('bought')||addDays(0), expires:fd.get('expires')||null, source:'cooked', dateLabel:'보관 시작'});
    save(); setTab('home');
    toast(`${eul(esc(it.name))} 저장했어요`, {label:'보기', fn:()=>go('zone',{loc:it.loc})});
  },
  rowSave: f => {
    const fd = new FormData(f), r = draft.rows[+f.dataset.i];
    const name = String(fd.get('name')||'').trim();
    if(!name){ markInvalid('rs-name-f','이름을 입력해 주세요.'); return; }
    Object.assign(r, { name, loc:fd.get('loc'), exp:fd.get('exp')||'', inc:true });
    if(r.suggest && name===r.suggest) r.low = false;
    draft.err = false; closeSheet(); render({keep:true});
  },
  useItems: f => {
    const ids = new FormData(f).getAll('u');
    if(!ids.length){ setTab('recipes'); return; }
    ids.forEach(id => { const it = S.items.find(i=>i.id===id); if(it){ it.status='used'; it.statusAt=addDays(0); } });
    save(); setTab('recipes');
    toast(`${ids.length}개를 소진 처리했어요`, {label:'되돌리기', fn:()=>{ ids.forEach(id=>{ const it=S.items.find(i=>i.id===id); if(it){it.status='active';it.statusAt=null;} }); save(); render({keep:true}); }});
  },
  shopAdd: () => {
    const q = ui.shopQ.trim(); if(!q) return;
    const n = q.replace(/\s+/g,'');
    const exact = Object.entries(CATALOG).find(([k,c]) => [c.name,c.short,...(c.alias||[])].filter(Boolean).some(x => x.replace(/\s+/g,'')===n));
    if(shopAdd(exact ? exact[0] : null, exact ? null : q) !== false) render({keep:true});
    setTimeout(()=>{ const i=$('#shop-in'); if(i) i.focus(); }, 0);
  },
  shopItemSave: f => {
    const s = S.shop.find(x=>x.id===f.dataset.id); if(!s) return;
    const fd = new FormData(f), v = digitsOnly(fd.get('mart')||'', 7);
    s.mart = v ? +v : null; s.ch = fd.get('ch') || null; save(); closeSheet(); render({keep:true});
    toast(`${CH.find(c=>c[0]===chosenCh(s))?.[1] || '구매처'}에서 사는 걸로 저장했어요`);
  },
  chatSend: f => { const i = $('#chat-in'); const v = i.value; i.value = ''; chatSend(v); setTimeout(()=>{ const x=$('#chat-in'); if(x) x.focus(); }, 0); },
  askFree: f => {
    const v = $('#ask-in').value.trim(); if(!v) return;
    $('#ask-out').innerHTML = `<div class="ask-a"><div class="who">데모 응답</div><b>${esc(v)}</b><br>이 프로토타입에는 AI가 연결되어 있지 않아 직접 쓴 질문에는 답할 수 없어요. 위의 예시 질문을 눌러 보세요.</div>`;
    $('#ask-in').value = '';
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(Date.now() - swipeBlock < 400 && el.closest('.sw')) return;
  const fn = A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act==='sheetBg'){ fn(el.dataset, el, e); return; }
  e.preventDefault(); fn(el.dataset, el, e);
});
document.addEventListener('change', e => { const el = e.target; if(el.dataset && CHG[el.dataset.chg]) CHG[el.dataset.chg](el); });
document.addEventListener('input', e => { const el = e.target; if(el.dataset && INP[el.dataset.inp]) INP[el.dataset.inp](el); });
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; if(SUB[f.dataset.sub]) SUB[f.dataset.sub](f); });
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter' && e.target.id==='ex-in'){ e.preventDefault(); A.exAdd(); }
});

document.title = APP.name;
render();

</script>
