<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>냉장고 노트 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 390px 고정 모바일 프레임 · 과제 A/B/C를 따로 시작하는 진입 화면 · 공통 냉장고/레시피/조리 · 하단 고정 CTA */
:root{
  --bg:#ffffff; --bg2:#f2f4f6; --bg3:#e9ecf0; --line:#e5e8eb;
  --fg:#191f28; --fg2:#4e5968; --fg3:#8b95a1; --fg4:#b0b8c1;
  --accent:#3182f6; --accent-press:#1b64da; --accent-weak:#e8f3ff;
  --danger:#f04452; --danger-weak:#ffeef0; --warn:#f57800; --warn-weak:#fff3e6;
  --ok:#03b26c; --ok-weak:#e5f8ef;
  --desk:#e9ecf0; --dim:rgba(0,12,30,.45); --shadow:0 12px 40px rgba(0,20,60,.12);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17171c; --bg2:#202027; --bg3:#2c2c35; --line:#2c2c35;
  --fg:#f2f3f5; --fg2:#c3c8d0; --fg3:#8d94a0; --fg4:#5d6470;
  --accent:#4d94ff; --accent-press:#3a7ee8; --accent-weak:#1c2b45;
  --danger:#ff5c6a; --danger-weak:#3a1f25; --warn:#ff9a33; --warn-weak:#3a2a1a;
  --ok:#2fcb87; --ok-weak:#163327;
  --desk:#0d0d11; --dim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17171c; --bg2:#202027; --bg3:#2c2c35; --line:#2c2c35;
  --fg:#f2f3f5; --fg2:#c3c8d0; --fg3:#8d94a0; --fg4:#5d6470;
  --accent:#4d94ff; --accent-press:#3a7ee8; --accent-weak:#1c2b45;
  --danger:#ff5c6a; --danger-weak:#3a1f25; --warn:#ff9a33; --warn-weak:#3a2a1a;
  --ok:#2fcb87; --ok-weak:#163327;
  --desk:#0d0d11; --dim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{height:100%;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:100%;max-width:390px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:480px){ .phone{height:min(100% - 32px,844px);border-radius:32px;box-shadow:var(--shadow);border:1px solid var(--line)} }
#screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.view{min-height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums}

/* type */
.h1{font-size:25px;line-height:1.38;font-weight:800;margin:0;text-wrap:balance;white-space:pre-line}
.h2{font-size:20px;line-height:1.4;font-weight:700;margin:0}
.h3{font-size:17px;font-weight:700;margin:0}
.sub{font-size:15px;color:var(--fg3);line-height:1.55;margin:8px 0 0;white-space:pre-line}
.cap{font-size:13px;color:var(--fg3)}

/* top bar */
.top{height:54px;display:flex;align-items:center;gap:6px;flex-shrink:0;position:sticky;top:0;background:var(--bg);z-index:5}
.top .title{font-size:17px;font-weight:700;flex:1}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;margin-left:-10px;color:var(--fg);flex-shrink:0}
.icon-btn:active{background:var(--bg2)}
.icon-btn svg{width:24px;height:24px}
.progress{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.tester-btn{height:32px;padding:0 10px;border-radius:9px;background:var(--bg2);color:var(--fg3);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.tester-btn svg{width:15px;height:15px}
.taskchip{height:26px;padding:0 9px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:12px;font-weight:800;display:inline-flex;align-items:center;flex-shrink:0}
.top-link{height:32px;padding:0 10px;border-radius:9px;background:var(--bg2);color:var(--fg2);font-size:13px;font-weight:700;white-space:nowrap}
.end-link{height:32px;padding:0 6px;color:var(--fg3);font-size:13px;font-weight:600;white-space:nowrap}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;transition:transform .1s,background .15s;padding:0 16px;text-align:center}
.btn:active{transform:scale(.98);background:var(--accent-press)}
.btn:disabled{background:var(--bg3);color:var(--fg4);transform:none}
.btn.sec{background:var(--accent-weak);color:var(--accent)}
.btn.grey{background:var(--bg2);color:var(--fg2)}
.btn.danger{background:var(--danger-weak);color:var(--danger)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px;width:auto}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.link{color:var(--fg3);font-size:14px;font-weight:500;padding:12px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--fg4)}
.cta-bar{position:sticky;bottom:0;padding-top:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 20px);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:4}
.text-btn{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}

/* blocks */
.section{padding-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.card{background:var(--bg2);border-radius:20px;padding:18px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left}
.row:active{opacity:.7}
.row .body{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--fg3);margin-top:3px}
.thumb{width:44px;height:44px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:24px;flex-shrink:0;color:var(--fg2);font-weight:700}
.thumb.lg{width:56px;height:56px;font-size:30px;border-radius:16px}
.chev{color:var(--fg4);width:18px;height:18px;flex-shrink:0}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.blue{background:var(--accent-weak);color:var(--accent)}
.pill.red{background:var(--danger-weak);color:var(--danger)}
.pill.orange{background:var(--warn-weak);color:var(--warn)}
.pill.green{background:var(--ok-weak);color:var(--ok)}
.pill.grey{background:var(--bg2);color:var(--fg3)}
.pill.dark{background:var(--fg);color:var(--bg)}
.notice{background:var(--warn-weak);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.5}
.demo{font-size:12px;color:var(--fg3);line-height:1.5}

/* hub */
.task-card{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:18px;border-radius:20px;background:var(--bg);border:1px solid var(--line);transition:transform .1s}
.task-card:active{transform:scale(.985)}
.task-card .t{font-size:17px;font-weight:700;line-height:1.4}
.task-card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task-card.locked{background:var(--bg2);border-color:transparent;color:var(--fg3);cursor:default}
.task-card.final{background:var(--accent);border-color:var(--accent);color:#fff}
.quote{background:var(--bg2);border-radius:18px;padding:18px;font-size:16px;line-height:1.65;font-weight:500;color:var(--fg)}
.todo{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.55;font-weight:600}

/* menu cards */
.rec{display:flex;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;background:var(--bg);border:1px solid var(--line);transition:transform .1s}
.rec:active{transform:scale(.985)}
.rec.on{border:2px solid var(--accent);padding:15px;background:var(--accent-weak)}
.rec .em{width:52px;height:52px;border-radius:16px;background:var(--bg2);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.rec .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rec .nm{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec .line{font-size:14px;font-weight:600;color:var(--fg2);line-height:1.45}
.rec .meta{font-size:13px;color:var(--fg3);display:flex;flex-wrap:wrap;gap:4px 10px;line-height:1.45}
.rec-list{display:flex;flex-direction:column;gap:10px}
.burden{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.burden div{background:var(--bg2);border-radius:10px;padding:8px 10px;min-width:0}
.rec.on .burden div{background:var(--bg)}
.burden span{display:block;font-size:11px;color:var(--fg3);font-weight:600}
.burden b{display:block;font-size:13px;margin-top:2px;line-height:1.4}
.why{font-size:13px;color:var(--fg2);line-height:1.55}

/* chips & options */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:20px;background:var(--bg2);color:var(--fg2);font-size:15px;font-weight:600;transition:background .15s,color .15s}
.chip.on{background:var(--accent);color:#fff}
.chip.sm{min-height:34px;font-size:14px;padding:0 12px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg3)}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.ftab{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;color:var(--fg3);white-space:nowrap;background:var(--bg2);flex-shrink:0}
.ftab.on{background:var(--fg);color:var(--bg)}

/* missing-ingredient panel (A) */
.fixbox{border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fixbox .fh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fixbox .fh b{font-size:16px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:14px;background:var(--bg2);border:2px solid transparent;transition:border-color .15s,background .15s}
.choice.on{border-color:var(--accent);background:var(--accent-weak)}
.choice .rd{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--fg4);flex-shrink:0;margin-top:1px;display:grid;place-items:center}
.choice.on .rd{box-shadow:inset 0 0 0 7px var(--accent)}
.choice .lbl{font-size:15px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.choice .amt{font-size:13px;color:var(--fg2);margin-top:4px;font-weight:600}
.choice .diff{font-size:13px;color:var(--fg2);margin-top:4px;line-height:1.55}
.other-btn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--fg2)}
.hardbox{background:var(--danger-weak);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.hardbox p{margin:0;font-size:14px;line-height:1.55;color:var(--fg)}

.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lb{font-size:13px;color:var(--fg3);font-weight:600}
.input{height:56px;border:0;border-bottom:2px solid var(--line);background:none;font-size:22px;font-weight:700;padding:0;outline:none;width:100%;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.input.box{height:52px;border:0;border-radius:14px;background:var(--bg2);font-size:16px;font-weight:500;padding:0 16px}
.input.box:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.money{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line)}
.money:focus-within{border-color:var(--accent)}
.money input{border:0;background:none;outline:none;font-size:26px;font-weight:800;width:100%;min-width:0;padding:8px 0;font-variant-numeric:tabular-nums}
.money span{font-size:20px;font-weight:700;color:var(--fg2)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:14px;background:var(--bg2);font-size:22px;font-weight:700;color:var(--fg2)}
.stepper b{font-size:26px;font-weight:800;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.budgetbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:4}
.budgetbar .sum{display:flex;justify-content:space-between;align-items:center;gap:10px}
.budgetbar .sum b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.opt-toggle{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:var(--bg2);font-size:12px;font-weight:700;color:var(--fg2)}
.opt-toggle.on{background:var(--accent-weak);color:var(--accent)}

/* compare */
.vp{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:18px;border-radius:20px;background:var(--bg2);border:2px solid transparent;transition:all .15s}
.vp.on{border-color:var(--accent);background:var(--accent-weak)}
.vp .ck{width:26px;height:26px;border-radius:8px;background:var(--bg3);color:#fff;display:grid;place-items:center;flex-shrink:0}
.vp.on .ck{background:var(--accent)}
.vp .ck svg{width:16px;height:16px}
.vp p{margin:0;font-size:16px;font-weight:600;line-height:1.55}

/* tab bar */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);flex-shrink:0}
.tabbar button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--fg4)}
.tabbar button.on{color:var(--fg)}
.tabbar svg{width:24px;height:24px}

/* sheet */
.dim{position:absolute;inset:0;background:var(--dim);z-index:30;opacity:0;transition:opacity .22s}
.dim.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:10px auto 0;flex-shrink:0}
.sheet .sc{overflow-y:auto;padding-top:20px}
.sheet .cta-bar{background:var(--bg);padding-top:12px}
.sheet-foot{height:max(24px,env(safe-area-inset-bottom,0px))}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:40;background:#2b303b;color:#fff;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:12px;transform:translateY(16px);opacity:0;transition:all .22s;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast span{flex:1}
.toast button{color:#7db1ff;font-weight:700;font-size:15px}

/* fridge */
.swipe{position:relative;overflow:hidden;border-radius:16px}
.swipe .bgl,.swipe .bgr{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font-size:14px;font-weight:700;opacity:0}
.swipe .bgl{background:var(--ok-weak);color:var(--ok)}
.swipe .bgr{background:var(--danger-weak);color:var(--danger);justify-content:flex-end}
.swipe .fg{position:relative;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none;padding:12px 4px;display:flex;align-items:center;gap:14px;cursor:grab}
.swipe .fg.anim{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.use{font-size:12px;color:var(--warn);font-weight:700;margin-top:3px}
.checked{color:var(--ok);font-size:12px;font-weight:600}
.hint{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--fg2);line-height:1.5}
.hint b{color:var(--fg)}
.missing{display:flex;flex-wrap:wrap;gap:6px}
.missing span{height:30px;padding:0 10px;border-radius:8px;background:var(--bg2);color:var(--fg3);font-size:13px;font-weight:600;display:inline-flex;align-items:center;text-decoration:line-through;text-decoration-color:var(--fg4)}

/* misc */
.empty{text-align:center;padding:40px 0;color:var(--fg3);font-size:15px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:8px}
.hero-dish{height:150px;border-radius:24px;background:var(--bg2);display:grid;place-items:center;font-size:76px}
.ing{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:15px}
.ing .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:12px;font-weight:800}
.ing .mark svg{width:14px;height:14px}
.ing .nm{flex:1;min-width:0;padding-top:1px}
.ing .am{color:var(--fg3);font-size:13px;white-space:nowrap;padding-top:2px}
.ing small{display:block;font-size:13px;margin-top:3px;font-weight:600;line-height:1.45}
.ing.have .mark{background:var(--ok-weak);color:var(--ok)}
.ing.swap .mark{background:var(--accent-weak);color:var(--accent)}
.ing.swap small{color:var(--accent)}
.ing.omit .mark{background:var(--bg2);color:var(--fg4)}
.ing.omit .nm{color:var(--fg3)}
.ing.omit small{color:var(--fg3);font-weight:500}
.ing.need .mark,.ing.hard .mark{background:var(--danger-weak);color:var(--danger)}
.ing.need small,.ing.hard small{color:var(--danger)}
.ing.excl .nm{color:var(--fg3);text-decoration:line-through}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;font-size:15px;line-height:1.55;color:var(--fg2)}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;color:var(--fg)}
.steps li.fixed{color:var(--accent);font-weight:600}
.cook-step{font-size:24px;line-height:1.5;font-weight:700;text-wrap:pretty;margin:0}
.stuck{height:42px;padding:0 14px;border-radius:12px;background:var(--bg2);font-size:14px;font-weight:600;color:var(--fg2);display:inline-flex;align-items:center;gap:6px}
.answer{background:var(--bg2);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.6;white-space:pre-line;margin-top:14px}
.done-mark{width:72px;height:72px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-bottom:24px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.done-mark.grey{background:var(--bg3);color:var(--fg2)}
.done-mark svg{width:36px;height:36px}
.intro-art{display:flex;gap:10px;font-size:40px;margin-bottom:28px}

const blockedBy=r=>{const ex=excludedIngs();return r.ings.filter(i=>!i.opt&&ex.includes(i.n)).map(i=>i.n)};

/* ---------- recipe logic ---------- */
const ckey=(rid,n)=>rid+'|'+n;
function fixOpts(r,n){const ex=excludedIngs();return (r.fix&&r.fix[n]||[]).filter(o=>!(o.use||[]).some(u=>ex.includes(u)||!has(u)))}
function lineOf(r,i){
  const ex=excludedIngs();
  if(ex.includes(i.n))return{k:'excl'};
  if(has(i.n))return{k:'have'};
  if(r.hard&&r.hard.ings.includes(i.n))return{k:'hard'};
  const opts=fixOpts(r,i.n);
  if(opts.length)return{k:'fix',opts};
  if(i.opt)return{k:'omit'};
  return{k:'need'};
}
/* A 과제: 참여자가 고른 방법 · B/C 과제: 첫 번째 방법으로 조용히 처리해요 */
function chosenFix(r,n){
  const opts=fixOpts(r,n);if(!opts.length)return null;
  if(ui.task==='A'){const k=ui.a.choice[ckey(r.id,n)];return opts.find(o=>o.k===k)||null}
  return opts[0];
}
function recipeState(r){
  const lines=r.ings.map(i=>({i,...lineOf(r,i)}));
  const hard=lines.some(l=>l.k==='hard'||l.k==='need');
  const pending=lines.filter(l=>l.k==='fix'&&!chosenFix(r,l.i.n));
  return{lines,hard,pending,ready:!hard&&!pending.length};
}
function stepText(r,s){
  if(typeof s==='string')return{t:s,f:false};
  if(has(s.fix))return{t:s.base,f:false};
  const c=chosenFix(r,s.fix);
  if(c)return{t:s[c.k]||s.base,f:true};
  return{t:s.base,f:false};
}
function missingSummary(r){
  const st=recipeState(r),miss=st.lines.filter(l=>l.k!=='have'&&l.k!=='excl');
  return miss;
}

const GA_ID=String(CFG.ga4Id||'').trim();

let syncState=ENDPOINT?'idle':'local',flushT=null,flushing=false;
function readLog(){try{return JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){return{}}}
function writeLog(l){try{localStorage.setItem(LKEY,JSON.stringify(l))}catch(e){}}

/* GA4: 이름 같은 개인정보는 보내지 않고, 무작위 참여자 코드(sid)만 보내요. */
if(GA_ID){
  window.dataLayer=window.dataLayer||[];window.gtag=function(){window.dataLayer.push(arguments)};
  gtag('js',new Date());gtag('config',GA_ID,{send_page_view:false,...(S.session?{user_id:S.session.sid}:{})});
  if(S.session)gtag('set','user_properties',{participant_code:S.session.sid,participant_group:S.session.sum.group==='기존 인터뷰 참여자'?'existing':S.session.sum.group?'new':'unknown'});
  const sc=document.createElement('script');sc.async=true;sc.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(GA_ID);document.head.append(sc);
}
function ga(name,params={}){
  if(!GA_ID||!window.gtag)return;
  const p={};Object.entries(params).forEach(([k,v])=>{if(v===undefined||v===null||v==='')return;if(Array.isArray(v))v=v.join(', ');if(typeof v==='boolean')v=v?'yes':'no';if(typeof v==='object')v=JSON.stringify(v);p[k.slice(0,40)]=typeof v==='string'?v.slice(0,100):v});
  if(S.session)p.participant_code=S.session.sid;
  if(CFG.gaDebug)p.debug_mode=true;
  try{gtag('event',name.slice(0,40),p)}catch(e){}
}
const GA_NAME={start:'test_start',session_end:'participant_end',back:'nav_back'};

function makeSession(name,group){
  return{sid:'s'+Date.now().toString(36)+uid(),t0:Date.now(),queue:[],inflight:0,sum:{name,group,startedAt:new Date().toISOString(),
    device:(/Mobi|Android|iPhone/i.test(navigator.userAgent)?'휴대폰':'PC')+' '+window.innerWidth+'px',order:'',
    A_status:'',A_menu:'',A_fixes:'',A_sec:'',A_otherMenu:0,A_hardSeen:'',A_opened:'',
    B_status:'',B_mode:'',B_days:'',B_budget:'',B_edited:'',B_edits:0,B_picks:'',B_spent:'',B_remaining:'',B_overSeen:'',B_sec:'',B_pickActions:0,
    C_status:'',C_menu:'',C_conds:'',C_condChanges:0,C_condCleared:'',C_sec:'',C_opened:'',
    fridgeViews:0,itemsAdded:0,itemsEdited:0,swipes:0,addAbandon:0,compareSel:'',firstPick:'',eventCount:0},
    _fix:{},_open:{A:[],C:[]},_t0:{}};
}
function track(type,d={}){
  const s=S.session;if(!s)return;
  const t=Math.round((Date.now()-s.t0)/1000),m=s.sum,T=d.task;
  switch(type){
    case 'task_start':s._t0[T]=t;m[T+'_status']='진행 중';if(!m.order.split(' → ').includes(T))m.order=m.order?m.order+' → '+T:T;break;
    case 'recipe_open':if(T==='A'||T==='C'){if(!s._open[T].includes(d.name))s._open[T].push(d.name);m[T+'_opened']=s._open[T].join(', ')}break;
    case 'fix_select':s._fix[d.recipe]=`${d.ingredient} → ${d.choice}`;m.A_fixes=Object.entries(s._fix).map(([k,v])=>`${k}: ${v}`).join(' / ');break;
    case 'fix_other':m.A_otherMenu++;break;
    case 'hard_seen':m.A_hardSeen='예';break;
    case 'budget_edit':m.B_edits++;break;
    case 'budget_set':m.B_mode='설정함';m.B_days=d.days;m.B_budget=d.budget;m.B_edited=d.edited?'수정함':'기본값 그대로';break;
    case 'budget_skip':m.B_mode='건너뜀';break;
    case 'pick':case 'unpick':m.B_pickActions++;break;
    case 'over_budget':m.B_overSeen='예';break;
    case 'cond_toggle':m.C_condChanges++;break;
    case 'cond_clear':m.C_condCleared='예';m.C_condChanges++;break;
    case 'decide':
      m[T+'_sec']=t-(s._t0[T]||0);m[T+'_menu']=d.name;
      if(T==='B'){m.B_picks=d.name;m.B_spent=d.spent;m.B_remaining=d.remaining===''?'':d.remaining}
      if(T==='C')m.C_conds=d.conds||'조건 없음';
      break;
    case 'task_end':m[T+'_status']=d.decided?'완료':'중단';if(!m[T+'_sec']&&!d.decided)m[T+'_sec']='';break;
    case 'fridge_view':m.fridgeViews++;break;
    case 'item_add':m.itemsAdded++;break;
    case 'item_edit':m.itemsEdited++;break;
    case 'swipe':m.swipes++;break;
    case 'add_close':if(!d.added)m.addAbandon++;break;
    case 'compare_done':m.compareSel=d.sel;m.firstPick=d.first;break;
  }
  m.eventCount++;
  const ev={at:Date.now(),t,type,d};
  s.queue.push(ev);
  const L=readLog();(L[s.sid]=L[s.sid]||{events:[],notes:{}}).sum=summaryOf(s);L[s.sid].events.push(ev);writeLog(L);
  save();scheduleFlush();
  ga(GA_NAME[type]||type,{...d,elapsed_sec:t});
}
const summaryOf=s=>({sid:s.sid,...s.sum});
const payload=(s,evs)=>JSON.stringify({sid:s.sid,summary:summaryOf(s),events:evs});
function scheduleFlush(ms=700){if(!ENDPOINT)return;clearTimeout(flushT);flushT=setTimeout(flush,ms)}
async function flush(){
  const s=S.session;if(!ENDPOINT||!s||flushing||!s.queue.length)return;
  flushing=true;const evs=s.queue.slice();s.inflight=evs.length;
  try{
    const r=await fetch(ENDPOINT,{method:'POST',body:payload(s,evs)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json().catch(()=>({ok:true}));if(j&&j.ok===false)throw new Error(j.error||'rejected');
    s.queue.splice(0,s.inflight);syncState='ok';
  }catch(e){syncState='fail'}
  s.inflight=0;flushing=false;save();
  if(s.queue.length)scheduleFlush(syncState==='fail'?5000:300);
}
function beacon(){
  const s=S.session;if(!ENDPOINT||!s)return;
  const rest=s.queue.slice(s.inflight||0);if(!rest.length)return;
  try{if(navigator.sendBeacon(ENDPOINT,new Blob([payload(s,rest)],{type:'text/plain'}))){s.queue.splice(s.inflight||0);save()}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')beacon();else scheduleFlush(100)});

function bCost(m){return m.optional?(ui.b.opt[m.id]?m.cost:0):m.cost}
function bTotals(){const b=ui.b,spent=b.picks.reduce((a,id)=>a+bCost(B_MENUS.find(m=>m.id===id)),0);return{spent,remain:b.budget-spent}}
V.bList=()=>{
  const b=ui.b,budgetMode=b.mode==='set',{spent,remain}=bTotals();

    else{const after=on?remain:remain-c;pill=after>=0?['blue',`예산이 남아요 · ${on?'':'담으면 '}${won(after)} 남음`]:['red','예산을 초과해요']}
    return `<div class="rec ${on?'on':''}" style="flex-direction:column;gap:12px">
      <button type="button" style="display:flex;gap:14px;text-align:left;width:100%" data-a="recipe" data-id="${m.id}">
       <div class="em">${r.e}</div><div class="body"><div class="nm">${r.name}${on?'<span class="pill dark">담음</span>':''}</div>
        <div class="meta"><span>재고 활용: ${esc(m.use)}</span></div>
        <div class="meta"><span>추가 구매: ${m.buy?esc(m.buy)+(m.optional?' (선택)':''):'없음'}</span><span class="num">예상 추가 비용 약 ${won(c)}</span></div>
        <span><span class="pill ${pill[0]}">${pill[1]}</span></span></div></button>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
       ${m.optional?`<button type="button" class="opt-toggle ${b.opt[m.id]?'on':''}" data-a="bOpt" data-id="${m.id}" aria-pressed="${!!b.opt[m.id]}">${b.opt[m.id]?'✓ ':''}${esc(m.buy)}도 사기 +약 ${won(m.cost)}</button>`:''}
       <span class="grow"></span>
       <button type="button" class="btn sm ${on?'grey':'sec'}" style="min-height:38px" data-a="bPick" data-id="${m.id}" ${!on&&b.picks.length>=b.days?'disabled':''}>${on?'빼기':'저녁 후보에 담기'}</button>
      </div></div>`;
  };
  const stock=menus.filter(m=>m.cost===0),buy=menus.filter(m=>m.cost>0);
  const status=!budgetMode?null:remain<0?['red','예산을 초과해요']:spent===0?['green','추가 구매 없이 가능']:['blue','예산이 남아요'];
  return `${taskbar()}<div class="pad" style="padding-top:4px">
    <h1 class="h1">${budgetMode?`${b.days}일 동안 먹을\n저녁을 골라보세요`:'냉장고 재료로\n먹을 저녁을 골라보세요'}</h1>
    ${budgetMode?`<p class="sub">예산 ${won(b.budget)} · 최대 ${b.days}개까지 담을 수 있어요 <button type="button" class="text-btn" data-a="bEdit">예산 바꾸기</button></p>`
      :`<p class="sub">예산 없이 보는 중이에요 <button type="button" class="text-btn" data-a="bEdit">예산 정하기</button></p>`}
   </div>
   <div class="pad section" style="padding-top:20px"><div class="section-head"><span class="h3">냉장고 재료로 해결</span><span class="cap">추가 구매 없음</span></div><div class="rec-list">${stock.map(card).join('')}</div></div>
   <div class="pad section"><div class="section-head"><span class="h3">조금만 사서 해결</span><span class="cap">한두 가지 추가</span></div><div class="rec-list">${buy.map(card).join('')}</div>
    ${hiddenNote(B_MENUS.map(m=>m.id))}
    <p class="demo" style="margin-top:12px">비용은 데모용 추정값이에요. 실제 마트 가격이 아니에요.</p></div>
   <div style="height:12px"></div>
   <div class="budgetbar pad">
    <div class="sum"><div><div class="cap">${budgetMode?'남은 예산':'추가 지출'}</div><b style="color:${remain<0&&budgetMode?'var(--danger)':'inherit'}">${budgetMode?won(remain):won(spent)}</b></div>
     <div style="text-align:right"><div class="cap">저녁 ${b.picks.length}/${b.days}개${budgetMode?` · 추가 지출 ${won(spent)}`:''}</div>${status?`<span class="pill ${status[0]}" style="margin-top:4px">${status[1]}</span>`:''}</div></div>

   </div>`;
};

/* C — 컨디션·기력 */
function cSorted(){
  const c=ui.c.conds,ids=visible(C_MENUS);
  const score=r=>(c.includes('quick')&&r.min>10?1000:0)+(c.includes('dish')?r.wash*100:0)+(c.includes('prep')?r.hands*10+r.cuts:0)+r.min*.01;
  return ids.map(id=>R[id]).sort((a,b)=>score(a)-score(b));
}
V.cList=()=>{
  const c=ui.c.conds,list=cSorted();
  const basis=[c.includes('quick')&&'10분 넘는 메뉴는 아래로',c.includes('dish')&&'설거지 거리 적은 순',c.includes('prep')&&'손이 가는 시간 짧은 순'].filter(Boolean);
  return `${taskbar()}<div class="pad" style="padding-top:4px">
    <h1 class="h1">지금 바로\n만들 메뉴를 골라보세요</h1>

     <div class="chips">${CONDS.map(x=>`<button type="button" class="chip sm ${c.includes(x.k)?'on':''}" data-a="cCond" data-k="${x.k}" aria-pressed="${c.includes(x.k)}">${c.includes(x.k)?'✓ ':''}${x.t}</button>`).join('')}

   </div>
   <div class="pad" style="padding-top:18px;padding-bottom:28px"><div class="rec-list">${list.map(r=>{
     const over=c.includes('quick')&&r.min>10;
     return `<button type="button" class="rec" style="flex-direction:column;gap:12px" data-a="recipe" data-id="${r.id}">
      <div style="display:flex;gap:14px;align-items:center;width:100%"><div class="em">${r.e}</div><div class="body"><div class="nm">${r.name}${over?`<span class="pill orange">약 ${r.min}분 · 10분 넘어요</span>`:''}</div></div></div>

       <div><span>손이 가는 시간</span><b class="num">약 ${r.hands}분 · 칼질 ${r.cuts}번</b></div>
       <div><span>조리 도구·그릇</span><b>${esc(r.tools)}</b></div>

      </div>
      <p class="why" style="margin:0">${esc(r.why)}</p></button>`}).join('')}</div>${hiddenNote(C_MENUS)}</div>`;
};

V.recipe=({id})=>{

    let k=l.k,sub='';
    if(k==='fix'){const c=chosenFix(r,l.i.n);if(c){k=c.k==='sub'?'swap':'omit';sub=c.k==='sub'?`${ro(c.amount)} 대신해요`:'넣지 않아요'}else{k='need';sub=T==='A'?'아래에서 어떻게 할지 골라주세요':''}}

  if(T==='A'){

         <div class="lbl">${esc(o.label)} <span class="pill ${o.k==='sub'?'blue':'grey'}">${o.k==='sub'?'대체':'생략'}</span></div>
         <div class="amt">양: ${esc(o.amount)}</div><div class="diff">${esc(o.t)}</div></div></button>`).join('')}
       <button type="button" class="other-btn" data-a="fixOther" data-id="${id}" data-n="${esc(l.i.n)}">↩ 다른 메뉴 보기</button></div>`}).join('');
    if(st.hard){
      const h=r.hard,alts=visible(h.alt);
      extra+=`<div class="hardbox"><div class="fh" style="display:flex;gap:8px;align-items:center"><span class="pill red">대체 어려움</span><b>${esc(h.ings.filter(n=>!has(n)).join(', '))} 없음</b></div><p>${esc(h.t)}</p>

        ${alts.map(a=>`<button type="button" class="other-btn" data-a="recipe" data-id="${a}" data-alt="1">${R[a].e} ${R[a].name} 보기 ${I.chev}</button>`).join('')}</div>`;

function toast(msg,undo){
  const t=document.getElementById('toast'),b=t.querySelector('button');
  t.querySelector('span').textContent=msg;b.hidden=!undo;b.onclick=()=>{track('undo',{msg,task:ui.task||''});undo&&undo();t.classList.remove('show')};

/* ---------- logic ---------- */
function consume(id,kind){
  const ix=S.items.findIndex(i=>i.id===id);if(ix<0)return;
  const it=S.items[ix];S.items.splice(ix,1);save();render();
  toast(kind?`${jo(it.name,'을','를')} 다 먹은 걸로 정리했어요`:`${jo(it.name,'을','를')} 뺐어요`,()=>{S.items.splice(ix,0,it);save();render()});
}
function keep(id){const it=S.items.find(i=>i.id===id);if(!it)return;const prev=it.checked;it.checked=new Date().toDateString();save();render();toast(`${it.name} 남아있는 걸로 확인했어요`,()=>{it.checked=prev;save();render()})}
function refreshAddList(){const q=document.getElementById('add-q'),l=document.getElementById('add-list');if(q&&l)l.innerHTML=addListHTML(q.value.trim())}
function finishTask(T,decided,lines){
  const st=S.tasks[T];
  if(st.status==='doing'){st.status=decided?'done':'ended';st.lines=lines||st.lines||[];if(decided&&lines)st.result=lines.map(x=>x[1]).join(' · ');track('task_end',{task:T,decided});}
  save();closeSheet();ui.stack=[{v:'hub'},{v:'taskDone',p:{task:T}}];render();
}

   const {spent,remain}=bTotals();
   track(on?'unpick':'pick',{task:'B',name:R[d.id].name,cost:bCost(m),spent,remaining:b.mode==='set'?remain:''});
   if(!on&&b.mode==='set'&&remain<0)track('over_budget',{task:'B',name:R[d.id].name,remaining:remain});
   if(d.from==='recipe'){back();toast(on?`${jo(R[d.id].name,'을','를')} 뺐어요`:`${jo(R[d.id].name,'을','를')} 담았어요`)}else render()},
 bDecide:()=>{const b=ui.b,{spent,remain}=bTotals(),names=b.picks.map(id=>R[id].name);
   const lines=[['저녁 후보',`${names.length}개`],...names.map((n,i)=>[`${i+1}`,n]),['추가 지출',`약 ${won(spent)}`]];
   if(b.mode==='set')lines.push(['남은 예산',`약 ${won(remain)}`]);else lines.push(['예산','설정 안 함']);
   track('decide',{task:'B',name:names.join(', '),spent,remaining:b.mode==='set'?remain:''});
   S.tasks.B.decided=true;finishTask('B',true,lines)},
 /* C */
 cCond:d=>{const c=ui.c.conds,on=!c.includes(d.k);on?c.push(d.k):c.splice(c.indexOf(d.k),1);track('cond_toggle',{task:'C',cond:CMAP[d.k],on});render()},
 cClear:()=>{ui.c.conds=[];track('cond_clear',{task:'C'});render()},
 /* fridge */
 fTab:d=>{ui.fTab=d.k;render()},
 hideHint:()=>{S.hintSeen=true;save();render()},
 addSheet:()=>{ui.addCount=0;track('add_open',{task:ui.task||''});openSheet(addSheetHTML(),'add')},
 addPick:d=>{const n=d.k;if(has(n)){toast(`${jo(n,'은','는')} 이미 냉장고에 있어요`);return}
   const it=newItem(n);S.items.push(it);ui.addCount++;track('item_add',{task:ui.task||'',name:n,custom:!ING[n]});save();render();refreshAddList();
   toast(`${jo(n,'을','를')} 넣었어요`,()=>{S.items=S.items.filter(x=>x.id!==it.id);save();render();refreshAddList()})},
 itemSheet:d=>{const it=S.items.find(i=>i.id===d.id);if(it){track('item_open',{task:ui.task||'',name:it.name});openSheet(itemSheetHTML(it))}},
 iStore:d=>{const it=S.items.find(i=>i.id===d.id);it.storage=d.k;track('item_edit',{task:ui.task||'',name:it.name,field:'보관'});save();render();openSheet(itemSheetHTML(it))},
 iSt:d=>{const it=S.items.find(i=>i.id===d.id);it.st=d.k;track('item_edit',{task:ui.task||'',name:it.name,field:'재고 상태'});save();render();openSheet(itemSheetHTML(it))},
 keep:d=>{track('item_status',{task:ui.task||'',status:'남아있어요'});closeSheet();keep(d.id)},
 consume:d=>{track('item_status',{task:ui.task||'',status:'다 먹었어요'});closeSheet();consume(d.id,true)},
 delItem:d=>{track('item_status',{task:ui.task||'',status:'잘못 넣었어요'});closeSheet();consume(d.id,false)},
 /* excludes */
 editEx:()=>{ui.draft={kind:'ex',v:[...S.excludes]};openSheet(exSheetHTML())},
 exT:d=>{const a=ui.draft.v;a.includes(d.k)?a.splice(a.indexOf(d.k),1):a.push(d.k);openSheet(exSheetHTML())},
 exSave:()=>{S.excludes=ui.draft.v;track('exclude',{v:S.excludes.join(', ')});save();closeSheet();render();toast(S.excludes.length?'못 먹는 재료를 저장했어요':'빼는 재료 없이 보여줄게요')},
 /* tester */
 tester:()=>{openSheet(testerHTML());track('tester_open')},
 newSession:()=>{track('session_end');beacon();S=blank();save();closeSheet();Object.assign(ui,freshTaskUI());ui.task=null;ui.fTab='all';ui.join={name:'',group:''};ui.stack=[{v:'join'}];render()},
 refill:()=>{track('tester_action',{what:'테스트 재고로 되돌리기'});S.items=sampleItems();save();closeSheet();render();toast('테스트 재고로 되돌렸어요')}
};
function toBList(){const prev=ui.stack[ui.stack.length-2];if(prev&&prev.v==='bList')back();else go('bList')}
function readBudget(){const el=document.getElementById('b-budget');if(!el)return;const v=parseInt(el.value.replace(/[^\d]/g,''),10);if(!isNaN(v)&&v!==ui.b.budget){ui.b.budget=v;ui.b.edited=true;track('budget_edit',{task:'B',field:'예산',value:v})}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='add-q')refreshAddList();
  if(t.id==='p-name'){ui.join.name=t.value;const b=document.getElementById('start-btn');if(b)b.disabled=!t.value.trim()}
  if(t.id==='b-budget'){const v=t.value.replace(/[^\d]/g,'');t.value=v?(+v).toLocaleString('ko-KR'):'';const dl=document.getElementById('b-daily');if(dl)dl.textContent=`하루 약 ${won(Math.floor((+v||0)/Math.max(1,ui.b.days)/100)*100)}`}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='b-budget')readBudget();
  if(t.id==='i-qty'){const it=S.items.find(i=>i.id===t.dataset.id);it.qty=t.value.trim();track('item_edit',{task:ui.task||'',name:it.name,field:'수량'});save();render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetEl)closeSheet();
  if(e.key==='Enter'&&e.target.id==='p-name'){e.preventDefault();A.start()}
  if(e.key==='Enter'&&e.target.id==='b-budget'){e.preventDefault();A.bSet()}
  if(e.key==='Enter'&&e.target.id==='add-q'){const q=e.target.value.trim();if(q)A.addPick({k:q})}
  const fg=e.target.closest&&e.target.closest('.swipe .fg');
  if(fg&&(e.key==='Enter'||e.key===' ')){e.preventDefault();A.itemSheet({id:fg.dataset.id})}
});

function bindSwipes(){
  document.querySelectorAll('.swipe .fg').forEach(fg=>{
    const wrap=fg.parentElement,bl=wrap.querySelector('.bgl'),br=wrap.querySelector('.bgr');
    let x0=null,y0=0,dx=0,locked=null;
    fg.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;locked=null;fg.classList.remove('anim')});
    fg.addEventListener('pointermove',e=>{if(x0===null)return;const mx=e.clientX-x0,my=e.clientY-y0;
      if(locked===null&&(Math.abs(mx)>6||Math.abs(my)>6)){locked=Math.abs(mx)>Math.abs(my)?'x':'y';if(locked==='x')fg.setPointerCapture(e.pointerId)}
      if(locked!=='x')return;dx=mx;fg.style.transform=`translateX(${dx}px)`;
      const p=Math.min(Math.abs(dx)/90,1);bl.style.opacity=dx>0?p:0;br.style.opacity=dx<0?p:0});
    const end=()=>{if(x0===null)return;const id=fg.dataset.id,wasX=locked==='x';x0=null;
      if(!wasX&&locked===null){A.itemSheet({id});return}
      if(dx>90||dx<-90){S.hintSeen=true;track('swipe',{task:ui.task||'',dir:dx>0?'오른쪽 · 남아있어요':'왼쪽 · 다 먹었어요',name:(S.items.find(i=>i.id===id)||{}).name});fg.classList.add('anim');fg.style.transform=`translateX(${dx>0?110:-110}%)`;setTimeout(()=>dx>0?keep(id):consume(id,true),200)}
      else{fg.classList.add('anim');fg.style.transform='';bl.style.opacity=br.style.opacity=0}};
    fg.addEventListener('pointerup',end);
    fg.addEventListener('pointercancel',()=>{x0=null;fg.classList.add('anim');fg.style.transform='';bl.style.opacity=br.style.opacity=0});
  });
}
render();
scheduleFlush(300);
</script>
